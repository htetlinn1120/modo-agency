name: MODO Planner build validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/modo-planner-saas-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js static site
        run: npm run build
